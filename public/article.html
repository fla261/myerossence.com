<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0c1518">
  <title id="page-title">Article — MyErossence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>
  <header class="header" id="header">
    <div class="header__inner">
      <div class="header__logo"><a href="index.html">MyErossence</a></div>
      <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false"><span></span><span></span><span></span></button>
      <nav class="nav-menu" role="navigation">
        <a href="index.html" class="nav-link">Home</a>
        <a href="shop.html" class="nav-link">Shop</a>
        <a href="blog.html" class="nav-link">Blog</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <article class="section">
      <div class="container content-page">
        <div id="article-content">
          <p class="loading">Loading article...</p>
        </div>
        <div class="article-footer">
          <a href="blog.html" class="btn btn-secondary">&larr; Back to Blog</a>
        </div>
      </div>
    </article>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer__bottom">
        <p>&copy; 2026 MyErossence. All rights reserved.</p>
        <p class="affiliate-notice">As an Amazon Associate, we earn from qualifying purchases.</p>
      </div>
    </div>
  </footer>

  <script src="js/supabase.js"></script>
  <script src="js/blog.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const slug = getQueryParam('slug');
      if (!slug) {
        document.getElementById('article-content').innerHTML = '<p>Article not found. <a href="blog.html">Back to Blog</a></p>';
        return;
      }
      try {
        const article = await loadArticleBySlug(slug);
        if (!article) {
          document.getElementById('article-content').innerHTML = '<p>Article not found. <a href="blog.html">Back to Blog</a></p>';
          return;
        }
        document.getElementById('page-title').textContent = `${article.title} — MyErossence`;
        if (article.seo_description) {
          const meta = document.createElement('meta');
          meta.name = 'description';
          meta.content = article.seo_description;
          document.head.appendChild(meta);
        }
        const date = new Date(article.created_at).toLocaleDateString('en-US', {
          year: 'numeric', month: 'long', day: 'numeric'
        });
        document.getElementById('article-content').innerHTML = `
          <span class="blog-category">${article.category || 'Hair Care'}</span>
          <h1>${article.title}</h1>
          <time class="blog-date">${date}</time>
          ${article.featured_image ? `<img src="${article.featured_image}" alt="${article.title}" class="article-hero-image">` : ''}
          <div class="article-body">${article.body_html || ''}</div>
        `;
      } catch (err) {
        document.getElementById('article-content').innerHTML = '<p>Failed to load article. <a href="blog.html">Back to Blog</a></p>';
      }
    });
  </script>
</body>
</html>
